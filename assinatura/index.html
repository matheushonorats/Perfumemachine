const lossMaps = {soft:{control:1,memorability:1},common:{identity:1,memorability:1},short:{duration:1},specific:{versatility:1}};
function weightsFor(answers={},context='main'){
 const w=Object.fromEntries(scoreKeys.map(k=>[k,1]));
 const modifiers=[];
 for(const [question,ans] of Object.entries(answers)){
  if(IMPACTS[question]?.[ans]){for(const [k,amount] of Object.entries(IMPACTS[question][ans]))w[k]+=amount;modifiers.push(question);}
 }
 if(answers.loss && typeof answers.loss==='object'){
  // When a loss is most acceptable its associated criteria decrease; least acceptable increases.
  for(const [k,amount] of Object.entries(lossMaps[answers.loss.best]||{}))w[k]=Math.max(.5,w[k]-amount*.55);
  for(const [k,amount] of Object.entries(lossMaps[answers.loss.worst]||{}))w[k]+=amount*2;
  modifiers.push('loss');
 }
 const contextAdd={main:{repetition:1},professional:{professional:3,indoor:2,control:1},heat:{heat:4,comfort:1},night:{identity:2,memorability:2,pleasure:1},cold:{identity:2,evolution:1,pleasure:1}};
 for(const [k,v] of Object.entries(contextAdd[context]||{}))w[k]+=v;
 for(const s of answers.situations||[]) {if (context==='main'&&scenarioWeight[s])w[scenarioWeight[s]]+=0.7;}
 const total=Object.values(w).reduce((a,b)=>a+b,0);

 const passingDays=new Set(passing.map(t=>t.date));
 const required= context==='main' ? (contexts.size>=2) : trials.filter(t=>t.context===context).length>=2;
 return {valid: passingDays.size>=3&&required&&passing.length>=3,
  trials:trials.length,days:dates.size,contexts:contexts.size,passing:passing.length,
  missing:[dates.size<3?'Três datas de uso distintas':null,!required?(context==='main'?'Testes em dois contextos':'Dois usos na categoria'):null,passingDays.size<3?'Três dias de experiências com conforto e desejo de repetir adequados':null].filter(Boolean)};

function evidenceFor(state,perfume,context='main'){

 for(const k of scoreKeys){const val=perfume.profile?.[k];if(isNum(val)&&val>=1&&val<=5){observed[k]=val;sources[k]='Avaliação explícita';}}
 const trials=trialsFor(state,perfume.id,context);
 // A flagged dosage/climate confound should not be generalized as a stable preference.
 const interpretable=trials.filter(t=>context!=='main'||!['dosage','weather'].includes(t.cause));
 if(interpretable.length){
  const means=arr=>arr.reduce((a,b)=>a+b,0)/arr.length;
  const map={comfort:interpretable.map(t=>(t.comfortAfter+t.comfortEnd)/2),repetition:interpretable.map(t=>t.repeat),duration:interpretable.filter(t=>isNum(t.durationFit)).map(t=>t.durationFit)};
  for(const [k,arr] of Object.entries(map)){if(arr.length){const empirical=means(arr);observed[k]=isNum(observed[k])?(observed[k]+empirical*2)/3:empirical;sources[k]=isNum(perfume.profile?.[k])?'Autoavaliação + testes (1:2)':'Registros práticos';}}

function scored(state,perfume,context='main',customWeights=null){
 const manual=perfume.definitive;
 const ce=perfume.contextExclusions?.[context]||((context==='main')?perfume.contextExclusions?.main:null);
 if(manual||ce)return {perfume,context,status:'excluded',reason:manual?`Exclusão definitiva: ${manual}`:`Exclusão contextual: ${ce}`,score:null,missing:scoreKeys};
 if(perfume.remainingMl===0)return {perfume,context,status:'ended',reason:state.signatures.ended.some(e=>e.perfumeId===perfume.id)?'Frasco finalizado':'Frasco sem conteúdo disponível',score:null,missing:[]};

 const required=['pleasure','comfort','repetition'];
 const missingRequired=required.filter(k=>!isNum(observed[k]));
 let sum=0;for(const k of present)sum+=observed[k]*weights[k];
 let value=coverage?sum/coverage:null;
 if(fit!==null&&value!==null)value=0.8*value+0.2*fit;

 const wins=matches.filter(c=>c.winner===perfume.id).length;

 if(value!==null)value=clamp(value+comparisonSignal,1,5);

function ranking(state,context='main'){

function sensitivity(state,context='main'){
 const eligible=ranking(state,context).filter(s=>s.status==='evaluated');
 if(eligible.length<2)return {total:0,wins:{},leaders:eligible.map(e=>e.perfume.id)};

 const variants=[];

   const adj={...weights,[k]:weights[k]*factor};const z=Object.values(adj).reduce((a,b)=>a+b,0);

// Fluxo guiado: reduzir esforço, sem imputar avaliações aos itens não selecionados.

const GUIDED_FIELDS = [
  {key:'pleasure', title:'Você realmente tem vontade de usar este perfume?', desc:'Pense no que escolhe por vontade própria, não em elogios.', options:[['5','Sim, escolho espontaneamente'],['4','Gosto bastante'],['3','Gosto, mas raramente escolho'],['2','Não me agrada o suficiente'],['skip','Ainda não sei']]},

function ensureJourney(s){

  const promising=ps.filter(p=>typeof p.profile?.pleasure==='number'&&p.profile.pleasure>=3);
  for(const field of GUIDED_FIELDS.slice(1))for(const p of promising){if(!(typeof p.profile?.[field.key]==='number')&&!j.skipped[p.id+'|'+field.key])return {perfume:p,field};}

function recordGuidedAnswer(s,id,key,value){const j=ensureJourney(s),p=s.catalog.find(x=>x.id===id);if(!j.ids.includes(id)||!p||!GUIDED_FIELDS.some(f=>f.key===key))throw Error('Resposta fora do diagnóstico guiado');

function selectSecondary(id){const category=state.categories.find(x=>x.id===id);const ranked=ranking(state,id).filter(x=>x.status==='evaluated'&&!x.perfume.definitive&&!x.perfume.contextExclusions?.[id]&&x.perfume.remainingMl!==0);return `${pageTitle('ASSINATURAS / CONTEXTO',category?.label||id,'Uma fragrância só será chamada de validada após a realização dos testes necessários.')}
<div class="method-inline">${esc(category?.detail||'Categoria customizada')} · Assinatura atual: ${esc(name(state.signatures.secondary[id]))}</div><div class="choice-list">${ranked.map(x=>`<article class="choice"><div><span class="eyebrow">${x.score} PONTOS · ${x.coverage}% DE COBERTURA</span><h3>${esc(name(x.perfume.id))}</h3><p>${x.validation.valid?'Critérios práticos atendidos':'A validar'} · ${x.trials} testes</p></div><button class="btn" data-action="assign-secondary" data-id="${id}" data-value="${x.perfume.id}">Vincular</button></article>`).join('')}</div>${ranked.length?'':'<div class="empty-method">Não há avaliações suficientes para esta categoria.</div>'}<div class="form-actions"><button class="btn" data-action="clear-secondary" data-id="${id}">Deixar sem assinatura distinta</button>${button('Voltar','go:signatures','','btn')}</div>`;}
function succession(){const m=state.signatures.main,p=m&&perfume(m.perfumeId),q=state.signatures.queue;return `${pageTitle('CONTINUIDADE / SUCESSÃO','Um frasco por vez.','A fila indica candidatos futuros, mas nunca substitui uma assinatura em uso por pequena oscilação de nota.')}
<div class="succession-current"><div><p class="eyebrow">EM USO ATUALMENTE</p><h2>${p?esc(name(p.id)):'Nenhuma assinatura ativa'}</h2><p>${p?`Restante estimado: ${p.remainingMl==null?'não informado':`${fmt(p.remainingMl)} ml`}. Ativada em ${formatDate(m.activatedAt?.slice(0,10))}.`:'Ative uma assinatura após avaliar finalistas.'}</p></div><div class="form-actions">${p?button('Marcar frasco terminado','finish-bottle','','btn warn'):button('Escolher principal','go:select-main','','btn primary')}${button('Recalcular fila','generate-queue','','btn')}</div></div>
${sectionTitle('Sequência deliberada')}<p class="small-note">A fila usa apenas candidatos avaliados e elegíveis. A diversidade depende de famílias que você tenha documentado — não de notas olfativas inventadas. Recalcular muda a fila, mas não o perfume ativo.</p><div class="succession-list">${q.length?q.map((id,i)=>`<article><span class="queue-index">${String(i+1).padStart(2,'0')}</span><div><strong>${esc(name(id))}</strong><small>${scored(state,perfume(id),'main').status==='evaluated'?`${fmt(scored(state,perfume(id),'main').score)} pontos relativos`:'Rever elegibilidade'} · ${perfume(id)?.remainingMl??'volume desconhecido'} ml</small></div><div class="queue-controls"><button aria-label="Subir na fila" data-action="queue-up" data-id="${id}" ${i===0?'disabled':''}>↑</button><button aria-label="Descer na fila" data-action="queue-down" data-id="${id}" ${i===q.length-1?'disabled':''}>↓</button><button aria-label="Retirar da fila" data-action="queue-remove" data-id="${id}">×</button></div></article>`).join(''):'<div class="empty-method">A fila está vazia. Avalie candidatos e escolha «Recalcular fila».</div>'}</div>
${sectionTitle('Frascos finalizados')}<div class="timeline">${state.signatures.ended.length?state.signatures.ended.map(x=>`<div class="timeline-item"><div class="timeline-date">${formatDate(x.at.slice(0,10))}</div><b>${esc(name(x.perfumeId))}</b></div>`).join(''):'<div class="empty-method">Nenhum frasco concluído neste histórico.</div>'}</div>`;}
function settings(){const a=catalogAudit(state.catalog);return `${pageTitle('SISTEMA / PREFERÊNCIAS','Método sob seu controle.','Seus dados são armazenados localmente neste navegador. Exportações permitem transferir o estudo entre dispositivos.')}
<div class="settings-columns"><section class="surface padded"><h2>Critérios de uso</h2><form id="settings-form"><div class="field"><label>Duração que considera suficiente, em horas</label><input type="number" min="0.5" max="24" step="0.5" name="sufficientHours" value="${state.settings.sufficientHours}"></div><div class="field"><label>Diversidade da sucessão</label><select name="diversity">${opts([['continuity','Priorizar continuidade'],['balance','Equilíbrio entre semelhança e mudança'],['contrast','Priorizar experiências distintas']],state.settings.diversity)}</select></div><button class="btn primary" type="submit">Salvar preferências</button></form></section><section class="surface padded"><h2>Integridade do catálogo</h2><p><strong>${a.originalEntries}</strong> entradas da lista original; <strong>${a.uniqueRecords}</strong> registros distintos.</p><p>${a.sourceDuplicates.length} repetição identificada: ${a.sourceDuplicates.map(d=>esc(d.name)+' ('+d.sameAs+' e '+d.entry+')').join('; ')}.</p><p>${a.liveDuplicates.length} duplicações atuais; ${a.soldPresent.length} produtos vendidos indevidamente cadastrados.</p><p class="small-note">Concentração, notas e famílias permanecem sem verificação até edição documentada.</p></section></div>
${sectionTitle('Categorias de assinatura')}<div class="settings-list">${state.categories.filter(c=>c.id!=='main').map(c=>`<div><span><strong>${esc(c.label)}</strong><small>${esc(c.detail||'')}</small></span><div class="form-actions"><button class="btn micro-btn" data-action="edit-category" data-id="${c.id}">Editar</button><button class="btn micro-btn" data-action="toggle-category" data-id="${c.id}">${c.disabled?'Reativar':'Desativar'}</button></div></div>`).join('')}</div><form id="category-form" class="inline-form"><input name="label" placeholder="Nova categoria (ex.: viagem)" required maxlength="55"><input name="detail" placeholder="Em quais situações?" maxlength="180"><button class="btn" type="submit">Adicionar</button></form>
${sectionTitle('Portabilidade e histórico')}<div class="form-actions spaced">${button('Exportar backup JSON','export','','btn primary')}<label class="btn import-label">Importar backup JSON<input id="import-file" type="file" accept="application/json,.json" hidden></label>${button('Rever prioridades das perguntas','triage-revise','','btn')}${button('Refazer diagnóstico avançado','reset-answers','','btn')}${button('Redefinir avaliações','reset-research','','btn warn')}</div><p class="small-note">Importar substitui o estado deste dispositivo após confirmação. Faça uma exportação primeiro. Dados não sincronizam automaticamente entre iPhone, iPad e computador.</p>
${sectionTitle('Trilha de auditoria',`<span class="subtle">${state.audit.length} eventos</span>`)}<div class="audit-list">${state.audit.slice(0,60).map(x=>`<div><time>${esc(x.at?.slice(0,16).replace('T',' '))}</time><strong>${esc(x.action)}</strong><span>${esc(x.detail)}</span></div>`).join('')}</div><details class="science"><summary>Metodologia, limites e incerteza</summary><p>O diagnóstico emprega escolhas discretas, compromissos de atributos e um exercício Best–Worst simplificado. Os pesos são regras transparentes e ajustáveis, não coeficientes psicométricos normatizados. O MCDA utiliza avaliações explícitas (1–5), registros práticos e pequenos sinais de confronto. Dados ausentes ficam ausentes, com limiar mínimo de cobertura e dimensões essenciais. A comparação de sensibilidade perturba cada peso em ±25%, sem atribuir probabilidade. A validação usa três dias distintos, ao menos dois contextos para a principal e três experiências adequadas: trata-se de critério operacional interno, não garantia científica. Uma experiência isolada nunca exclui automaticamente um perfume. Dados técnicos sem fonte continuam não verificados.</p></details>`;}
function pruneConditionalAnswers(){for(const q of QUESTIONS){if(q.conditional&&!q.conditional(state.answers))delete state.answers[q.id];}}
function confirmIt(text){return window.confirm(text);}
async function onAction(target){const a=target.dataset.action,id=target.dataset.id;
 try {
 if(a==='begin'){state.introductionSeen=true;tab='guide';ensureTriage(state);await commit('onboarding','Início da triagem progressiva');return;}
 if(a==='triage-answer'){const q=nextTriageQuestion(state);if(!q)throw Error('Pergunta já respondida');answerTriage(state,q.id,target.dataset.value);await commit();return;}
 if(a==='triage-choice'){chooseRound(state,target.dataset.value);await commit();return;}
 if(a==='triage-repeat'){chooseEndurance(state,target.dataset.value);await commit();return;}
 if(a==='triage-discard'){chooseDiscard(state,target.dataset.value);await commit();return;}
 if(a==='triage-revise'){const t=ensureTriage(state);t.answers={};t.pending=null;t.current=null;tab='guide';await commit('triage_priorities_revised','Critérios reiniciados; rodadas mantidas');return;}
 if(a==='triage-undo'){if(!undoRound(state))throw Error('Ainda não existe uma rodada para desfazer');await commit();return;}
 if(a==='triage-context'){const t=ensureTriage(state);if(t.pending)throw Error('Conclua esta comparação antes de trocar de categoria.');if(nextTriageQuestion(state))throw Error('Conclua as primeiras perguntas antes de escolher a categoria.');t.current=null;generateRound(state,target.dataset.value);tab='guide';await commit('triage_context_selected',target.dataset.value);return;}
 if(a==='triage-reinstate'){if(!undoVeto(state,id,target.dataset.context))throw Error('Nenhuma exclusão contextual encontrada');await commit();return;}
 if(a==='triage-activate'){const c=target.dataset.context;if(!confirmIt('Definir '+name(id)+' como assinatura em teste de '+(c==='main'?'cotidiano':c)+'? Ela ainda não está validada por testes na pele.'))return;activateSignature(state,id,c);await commit();return;}
 if(a==='triage-finish'){const c=target.dataset.context;if(!confirmIt('O frasco realmente terminou? A próxima opção elegível dessa fila assumirá a categoria.'))return;const idBefore=c==='main'?state.signatures.main?.perfumeId:state.signatures.secondary?.[c];const next=finishSignatureBottle(state,c);await commit();flash(next?'Frasco concluído. O próximo da sequência assumiu.':'Frasco concluído. Ainda não há sucessor com evidências.');return;}
 if(a==='triage-move'){moveQueue(state,target.dataset.context,id,Number(target.dataset.dir));await commit();return;}

 if(a==='guide-add'){addCandidate(state,id);guideSearch='';await commit('candidate_added',name(id));return;}
 if(a==='guide-remove'){removeCandidate(state,id);await commit('candidate_removed',id);return;}
 if(a==='guide-start'){if(ensureJourney(state).ids.length<2)throw Error('Escolha ao menos dois nomes para comparar.');ensureJourney(state).started=true;guideAdding=false;guideSessionPreview=false;await commit('guide_started','Seleção inicial');return;}
 if(a==='guide-done-adding'){guideAdding=false;render();return;}
 if(a==='guide-edit'){guideAdding=true;guideSessionPreview=false;render();return;}
 if(a==='guide-preview'){guideSessionPreview=true;render();return;}
 if(a==='guide-resume'){guideSessionPreview=false;render();return;}
 if(a==='guide-answer'){recordGuidedAnswer(state,id,target.dataset.key,target.dataset.value);await commit('quick_answer',name(id)+': '+target.dataset.key+'='+target.dataset.value);return;}
 if(a==='guide-activate'){const x=guidedResults(state).find(x=>x.perfume.id===id);if(!x?.complete||x.discouraged||x.uses<1)throw Error('Registre respostas e ao menos um uso real antes de assumir.');if(!confirmIt('Usar '+name(id)+' como sua assinatura principal EM TESTE? Isso não significa validação: ela precisa de uso repetido.'))return;setMain(state,id);tab='signatures';await commit();return;}
 if(a==='guide-test'){quickSelected=id;tab='quick';render();return;}
 if(a==='guide-duel'){registerComparison(state,{a:id,b:target.dataset.other,context:'main',winner:id,loser:target.dataset.other});await commit();return;}
 if(a==='guide-duel-skip'){state.comparisons.unshift({id:'defer'+Date.now(),a:id,b:target.dataset.other,context:'main',winner:null,loser:null,at:new Date().toISOString(),status:'test'});await commit('comparison_deferred','Duelo adiado para uso real');return;}
 if(a==='quick-delete'){state.quickUses=state.quickUses.filter(t=>t.id!==id);await commit('quick_use_deleted',id);return;}
 if(a?.startsWith('go:')){const t=a.slice(3);if(t==='comparisons'){tab='comparisons';render();return;}if(t==='select-main'){tab='selectMain';render();return;}go(t);return;}
 if(a==='answer'){state.answers[target.dataset.question]=target.dataset.value;pruneConditionalAnswers();await commit('answer',target.dataset.question+': '+target.dataset.value);return;}
 if(a==='remove-answer'){delete state.answers[id];pruneConditionalAnswers();tab='diagnosis';await commit('answer_revised','Removida resposta: '+id);return;}
 if(a==='detail'){detailId=id;render();return;}
 if(a==='close-modal'){detailId=null;trialEdit=null;render();return;}
 if(a==='new-trial'){trialEdit={};render();return;}
 if(a==='start-trial'){detailId=null;tab='laboratory';trialEdit={perfumeId:id};render();return;}
 if(a==='edit-trial'){trialEdit=id;render();return;}
 if(a==='delete-trial'){if(!confirmIt('Excluir este teste? O ranking será recalculado.'))return;state.experiences=state.experiences.filter(x=>x.id!==id);await commit('trial_deleted',id);return;}
 if(a==='delete-comparison'){if(!confirmIt('Excluir este confronto?'))return;state.comparisons=state.comparisons.filter(x=>x.id!==id);await commit('comparison_deleted',id);return;}
 if(a==='activate-main'){const p=perfume(id);if(!confirmIt(`Ativar ${p.name} como assinatura principal? ${validationFor(state,id).valid?'O protocolo de validação foi atendido.':'A escolha ficará identificada como não validada até concluir os testes.'}`))return;setMain(state,id);tab='signatures';await commit();return;}
 if(a==='select-secondary'){tab='secondary:'+id;render();return;}
 if(a==='assign-secondary'){state.signatures.secondary[id]=target.dataset.value;tab='signatures';await commit('secondary_set',id+': '+target.dataset.value);return;}
 if(a==='clear-secondary'){delete state.signatures.secondary[id];tab='signatures';await commit('secondary_clear',id);return;}
 if(a==='generate-queue'){generateQueue(state);await commit();return;}
 if(a==='finish-bottle'){if(!confirmIt(`Confirmar que terminou ${name(state.signatures.main?.perfumeId)}? A próxima fragrância elegível da fila será ativada.`))return;finishBottle(state);await commit();return;}
 if(a?.startsWith('queue-')){const q=state.signatures.queue,i=q.indexOf(id);if(i<0)return;if(a==='queue-remove')q.splice(i,1);if(a==='queue-up'&&i>0)[q[i-1],q[i]]=[q[i],q[i-1]];if(a==='queue-down'&&i<q.length-1)[q[i],q[i+1]]=[q[i+1],q[i]];await commit('queue_edited',a+': '+id);return;}
 if(a==='edit-category'){const c=state.categories.find(c=>c.id===id);if(!c)return;const label=window.prompt('Nome da categoria',c.label);if(label===null)return;if(!label.trim())throw Error('Informe o nome da categoria');const description=window.prompt('Condições de uso',c.detail||'');if(description===null)return;const prior=`${c.label}: ${c.detail||''}`;c.label=label.trim().slice(0,60);c.detail=description.trim().slice(0,300);await commit('category_edited',`${prior} → ${c.label}: ${c.detail}`);return;}
 if(a==='toggle-category'){const c=state.categories.find(c=>c.id===id);c.disabled=!c.disabled;await commit('category_toggled',id+': '+(c.disabled?'off':'on'));return;}
 if(a==='export'){downloadJSON('ASSINATURA-backup-'+dateLocal()+'.json',state);flash('Backup JSON preparado para salvar ou compartilhar.');return;}
 if(a==='reset-answers'){if(!confirmIt('Apagar respostas do diagnóstico? Avaliações e testes serão preservados.'))return;state.answers={};tab='diagnosis';await commit('answers_reset','Pesos serão recalculados');return;}
 if(a==='reset-research'){if(!confirmIt('Apagar avaliações pessoais, testes, confrontos, assinaturas e fila? O catálogo e suas edições técnicas serão preservados.'))return;state.answers={};state.comparisons=[];state.experiences=[];state.signatures={main:null,queue:[],secondary:{},ended:[]};state.catalog.forEach(p=>{p.profile={};p.contexts={};p.definitive=null;p.contextExclusions={};});state.journey={ids:[],skipped:{}};state.triage={answers:{},rounds:[],current:null,pending:null,roundIndex:0,startedAt:new Date().toISOString(),queueOverrides:{}};state.quickUses=[];tab='guide';guideAdding=true;await commit('research_reset','Avaliações, escolhas e histórico prático redefinidos');return;}
 } catch(e){flash(e.message);}
}
app.addEventListener('click',async e=>{const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return;}const b=e.target.closest('[data-action]');if(!b)return;if(b.classList.contains('modal-overlay')&&e.target!==b)return;await onAction(b);});
app.addEventListener('input',e=>{if(e.target.id==='guide-search'){guideSearch=e.target.value;const root=document.querySelector('#guide-results');if(root)root.innerHTML=guideMatches();}if(e.target.id==='collection-search'){const pos=e.target.selectionStart;collectionSearch=e.target.value;render();const inp=document.querySelector('#collection-search');inp?.focus();inp?.setSelectionRange(pos,pos);}});
app.addEventListener('change',e=>{if(e.target.id==='collection-filter'){collectionFilter=e.target.value;render();}if(e.target.id==='collection-sort'){sortCollection=e.target.value;render();}if(e.target.id==='context-select'){context=e.target.value;render();}if(e.target.id==='ranking-filter'){filterRanking=e.target.value;render();}});
app.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,fd=new FormData(f);try{
 if(f.getAttribute('id')==='quick-use-form'){const x={perfumeId:fd.get('perfumeId'),date:fd.get('date'),context:fd.get('context'),comfort:fd.get('comfort'),repeat:fd.get('repeat'),issue:fd.get('issue')||'none'};addQuickUse(state,x);quickSelected=x.perfumeId;await commit('quick_use_added',name(x.perfumeId)+' em '+x.date+' · conforto '+x.comfort+' · repetir '+x.repeat);flash('Uso registrado. Suas hipóteses foram atualizadas.');return;}
 if(f.getAttribute('id')==='multi-form'){const sel=fd.getAll('situation');if(sel.length<1||sel.length>4)throw Error('Selecione de uma a quatro situações.');state.answers.situations=sel;await commit('answer','situações: '+sel.join(', '));}
 if(f.getAttribute('id')==='bw-form'){const best=fd.get('best'),worst=fd.get('worst');if(!best||!worst||best===worst)throw Error('Selecione perdas diferentes.');state.answers.loss={best,worst};await commit('answer',`perda aceitável ${best}; menos aceitável ${worst}`);}
 if(f.getAttribute('id')==='perfume-form'){const id=f.dataset.id,p=perfume(id);const n=v=>v===''?null:Number(v);const prof={},ctx={};for(const c of CRITERIA){const v=fd.get('p-'+c.key);if(v)prof[c.key]=Number(v);}for(const c of state.categories){const v=fd.get('context-'+c.id);if(v)ctx[c.id]=Number(v);}const ce={...(p.contextExclusions||{})};if(fd.get('excluded-main'))ce.main=fd.get('excluded-main').trim();else delete ce.main;const where=fd.get('excluded-where'),reason=fd.get('excluded-reason')?.trim();if(where){if(reason)ce[where]=reason;else delete ce[where];}
 const sources=fd.get('sourceUrl')?.trim()?[{url:fd.get('sourceUrl').trim(),type:'fonte indicada pelo usuário',verified:false}]:[];
 updatePerfume(state,id,{brand:fd.get('brand').trim(),name:fd.get('name').trim(),concentration:fd.get('concentration')?.trim()||null,family:fd.get('family')?.trim()||null,notes:fd.get('notes')?.trim()||null,performance:fd.get('performance')?.trim()||null,bottleMl:n(fd.get('bottleMl')),remainingMl:n(fd.get('remainingMl')),sources,profile:prof,contexts:ctx,definitive:fd.get('definitive')?.trim()||null,contextExclusions:ce});detailId=null;await commit();flash('Ficha e avaliação salvas.');}
 if(f.getAttribute('id')==='trial-form'){const val=k=>fd.get(k)===''?null:Number(fd.get(k));let t={id:fd.get('id')||undefined,perfumeId:fd.get('perfumeId'),date:fd.get('date'),context:fd.get('context'),temperature:val('temperature'),durationHours:val('durationHours'),weather:fd.get('weather'),sprays:val('sprays'),application:fd.get('application')?.trim(),environment:fd.get('environment')?.trim(),comfortStart:val('comfortStart'),comfortAfter:val('comfortAfter'),comfortEnd:val('comfortEnd'),repeat:val('repeat'),durationFit:val('durationFit'),discomfort:val('discomfort'),saturation:fd.get('saturation')?.trim(),notes:fd.get('notes')?.trim()};recordTrial(state,t);trialEdit=null;await commit();flash('Experiência registrada; evidências recalculadas.');}
 if(f.getAttribute('id')==='comparison-form'){const submit=e.submitter?.value||'unknown',a=fd.get('a'),b=fd.get('b'),ctx=fd.get('context');if(!a||!b||a===b)throw Error('Selecione dois perfumes diferentes.');if(submit==='a'||submit==='b')registerComparison(state,{a,b,context:ctx,winner:submit==='a'?a:b,loser:submit==='a'?b:a});else {state.comparisons.unshift({id:'defer'+Date.now(),a,b,context:ctx,winner:null,loser:null,at:new Date().toISOString(),status:submit==='test'?'test':'unknown'});log(state,'comparison_deferred',`${a} × ${b}: ${submit}`);}tab='laboratory';await commit();flash('Confronto registrado.');}
 if(f.getAttribute('id')==='settings-form'){const h=Number(fd.get('sufficientHours'));if(!Number.isFinite(h)||h<.5||h>24)throw Error('Informe um número de horas entre 0,5 e 24.');state.settings.sufficientHours=h;state.settings.diversity=fd.get('diversity');await commit('settings_changed','Expectativa de duração e sucessão');}
 if(f.getAttribute('id')==='category-form'){const label=fd.get('label').trim(),detail=fd.get('detail').trim();if(!label)throw Error('Informe nome');const id='custom'+Date.now();state.categories.push({id,label,detail,disabled:false});await commit('category_added',label);}
 }catch(err){flash(err.message);}});
app.addEventListener('change',async e=>{if(e.target.id==='import-file'&&e.target.files?.[0]){try{const data=await readJSONFile(e.target.files[0]);validateImport(data);if(!confirmIt('Importar este backup substitui todos os registros locais atuais. Continuar?'))return;state=data;tab='home';detailId=null;await commit('backup_imported','Backup importado e validado');flash('Backup restaurado com sucesso.');}catch(err){flash('Importação recusada: '+err.message);}}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&(detailId||trialEdit)){detailId=null;trialEdit=null;render();}});
function screen(){if(tab==='comparisons')return comparisons();if(tab==='selectMain')return selectMain();if(tab.startsWith('secondary:'))return selectSecondary(tab.slice(10));return null;}
const originalRender=render;
// render specialized routes without changing the navigation contract
render=function(){if(['comparisons','selectMain'].includes(tab)||tab.startsWith('secondary:')){const page=screen();const old=tab;tab='laboratory';originalRender();tab=old;document.querySelector('#main').innerHTML=page;return;}originalRender();};
(async()=>{try{const saved=await readState();if(saved){validateImport(saved);state=saved;}}catch(err){console.warn('O backup local não pôde ser carregado',err);notice='Dados anteriores indisponíveis. Verifique o backup antes de continuar.';}render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
